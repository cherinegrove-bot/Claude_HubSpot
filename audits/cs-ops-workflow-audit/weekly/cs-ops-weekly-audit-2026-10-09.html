 (D.schedules||[]).forEach(s=>{const hit=s.kind==='daily'||(s.kind==='monthly'&&s.days.includes(d))||(s.kind==='weekly'&&s.days.includes(dow));if(!hit)return;
  const k=s.type+'|'+s.time,r=by[k]=by[k]||{type:s.type,time:s.time,wfs:[],off:true};r.wfs.push({id:s.workflow,name:s.workflow_name,off:s.off_now});r.off=r.off&&s.off_now;});
 return Object.values(by).sort((a,b)=>a.time.localeCompare(b.time)||a.type.localeCompare(b.type));}
function runResult(r,date){const pre=D.before_start&&date>=w0&&date<D.before_start.cutoff;const t=(pre?D.before_start.types:D.types).find(x=>x.name===r.type);
 if(date<(D.start_date||'')&&!pre)return{st:'grey',txt:'Before the audit start date, not checked'};
 if(date<w0)return{st:'grey',txt:'Outside this week\'s window (checked in an earlier week)'};
 if(date>w1||date>today)return{st:'grey',txt:'Hasn\'t happened yet'};
 if(r.off)return{st:'grey',txt:'Workflow switched off now'};
 if(!t)return{st:'grey',txt:'No result'};
 const mv=Object.values(t.missing).filter(m=>!m.not_flagged),miss=mv.filter(m=>!m.waiting_on).length,wait=mv.length-miss,sh=pre?0:Object.keys(t.shouldnt).length,
  other=(pre?D.before_start.problems:D.problems).filter(p=>p.q===1&&p.type===t.name&&p.kind!=='missing'&&p.kind!=='shouldnt').length,
  kd=(D.known_days||[]).filter(k=>k.date===date&&k.type===r.type),base=`${t.got.length} of ${t.should.length} facilities got it`;
 if(miss||sh||other)return{st:'bad',txt:base+[miss?`${miss} missing`:'',sh?`${sh} shouldn't have it`:'',other?plural(other,'other problem'):''].filter(Boolean).map(x=>', '+x).join(''),t};
 if(kd.length)return{st:'known',txt:base+'. Known issue '+kd.map(k=>`${k.known_issue} (${plural(k.tasks,'task')}): ${(D.known_issues.find(x=>x.id===k.known_issue)||{}).text||''}`).join('; '),t};
 if(wait)return{st:'wait',txt:base+`, ${wait} waiting on ${D.decision_owner}`,t};
 return{st:'ok',txt:base+', created correctly',t};}
function dayState(y,m,d){const date=ymd(y,m,d),runs=runsOn(y,m,d).map(r=>({...r,res:runResult(r,date)}));
 return{date,runs,st:runs.reduce((a,r)=>RANK[r.res.st]>RANK[a]?r.res.st:a,'grey')};}
const STLAB={ok:'All created',bad:'Problems',known:'Known issue',wait:'Waiting',grey:''};
function dayCell(y,m,d,list){const S=dayState(y,m,d),cls=['cal-day','s-'+S.st];if(S.date===calSel)cls.push('sel');
 const head=`<div class="cal-num"><span>${list?esc(day(S.date)):d}</span><span class="cal-tag st">${S.runs.length?STLAB[S.st]:''}${S.date===today?(S.runs.length&&STLAB[S.st]?' · ':'')+'Today':''}</span></div>`;
 const body=S.runs.map(r=>`<span class="cal-run${r.off?' off':''}" title="${esc(r.type)}">${r.time?esc(r.time)+' ':''}${esc(r.type)}</span>`).join('');
 return S.runs.length?`<button class="${cls.join(' ')}" data-day="${S.date}">${head}${body}</button>`:`<div class="${cls.join(' ')}">${head}</div>`;}
function dayDetail(date){const [y,m,d]=date.split('-').map(Number),S=dayState(y,m-1,d);
 return `<div class="panel cal-detail"><h3>${esc(day(date))}${date===today?' (today)':''}</h3><div class="tw" style="margin-top:10px"><table><tr><th>Time</th><th>Task type</th><th>Made by</th><th>Result</th></tr>${S.runs.map(r=>{
  const c=r.res.st==='bad'?'badtxt':r.res.st==='ok'?'okg':'ok';
  return `<tr><td>${esc(r.time||'When triggered')}</td><td>${r.res.t?`<a href="#" data-ty="${esc(r.type)}">${esc(r.type)}</a>`:esc(r.type)}</td><td>${r.wfs.map(w=>wfLink(w.id,w.name)+(w.off?' <span class="ok">(switched off now)</span>':'')).join('<br>')}</td><td class="${c}">${esc(r.res.txt)}</td></tr>`;}).join('')}</table></div>
 ${S.runs.some(r=>r.res.t)?'<p class="ok" style="margin:10px 0 0">Click a task type for the facilities. Results cover the whole window, so a task type that ran twice this week shows the same result on both days.</p>':''}</div>`;}
function calHTML(){const first=(new Date(Date.UTC(calY,calM,1)).getUTCDay()+6)%7,n=new Date(Date.UTC(calY,calM+1,0)).getUTCDate();
 let g=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(x=>`<div class="cal-dow">${x}</div>`).join(''),list='';
 for(let i=0;i<first;i++)g+='<div class="cal-day pad"></div>';
 for(let d=1;d<=n;d++){g+=dayCell(calY,calM,d,false);if(runsOn(calY,calM,d).length)list+=dayCell(calY,calM,d,true);}

 const off=(D.schedules||[]).filter(s=>s.off_now).map(s=>s.workflow_name).filter((v,i,a)=>a.indexOf(v)===i);

document.addEventListener('click',e=>{const f=e.target.closest('[data-f]');if(f){e.preventDefault();openFacility(f.dataset.f);return;}if(!e.target.closest('.search'))sg.style.display='none';});
function facTypes(id){const rows=D.types.filter(t=>t.runs.length).map(t=>{let st;
  if(t.got.includes(id))st='<span class="ok">Got it</span>';
  else if(t.missing[id])st=t.missing[id].waiting_on?`<span class="ok">Missing: ${esc(t.missing[id].reason)}</span>`:`<span class="badtxt">Missing: ${esc(t.missing[id].reason)}</span>`;
  else if(t.should.includes(id))st='<span class="ok">Due</span>';
  else st='<span class="ok">Not due this week (workflow settings)</span>';
  return `<tr><td>${esc(t.name)}</td><td>${st}</td></tr>`;});
 return rows.length?`<h3>Task types that ran this week</h3><div class="tw" style="margin:8px 0 18px"><table><tr><th>Task type</th><th>This facility</th></tr>${rows.join('')}</table></div>`:'';}
function openFacility(id){sg.style.display='none';inp.value='';const ts=byCompany[id]||[],ps=probsBy[id]||[];
 $('#facility').innerHTML=`<div class="facil"><button class="x" onclick="document.getElementById('facility').innerHTML=''">Close</button>
 <h2>${ext(coUrl(id),esc(company(id)))}</h2><p class="ok" style="margin:2px 0 16px">Company ID ${esc(id)}  ·  ${plural(ts.length,'task')} this week${ps.length?`  ·  <span class="badtxt">${plural(ps.length,'problem')}</span>`:''}</p>
 ${ps.length?`<h3>Problems</h3><div class="list" style="margin:8px 0 18px">${ps.map(p=>`<div class="panel" style="margin:0;border-left:5px solid var(--red)"><b>${esc(p.type||'')}</b>: ${esc(p.moved_by?('moved out of '+D.queue+' to '+qname(p.moved_by.queue)+' by the “'+p.moved_by.workflow_name+'” workflow'):(p.reason||p.kind))}<div class="meta">${chips(p.label)}</div></div>`).join('')}</div>`:''}
 ${facTypes(id)}
 <h3>Tasks this week</h3>${ts.length?`<div class="tw" style="margin-top:8px"><table><tr><th>Task</th><th>Created</th><th>Due</th><th>Queue</th></tr>${ts.map(t=>`<tr><td>${taskLink(t.id,t.title)}</td><td>${esc(when(t.created))}</td><td>${esc(when(t.due))}</td><td>${t.in_queue?'<span class="ok">'+esc(D.queue)+'</span>':t.before_start?'<span class="ok">Before the queue existed</span>':'<span class="badtxt">Moved out</span>'}</td></tr>`).join('')}</table></div>`:'<div class="empty" style="margin-top:8px">No tasks for this facility this week.</div>'}</div>`;
 window.scrollTo({top:0,behavior:'smooth'});}

/* ---------- legend ---------- */
$('#legend').innerHTML=`<span><b>How we know:</b></span>${Object.entries(LABEL).map(([k,v])=>`<span><span class="chip">${v}</span> ${k}</span>`).join('')}<span>Who should get a task comes from the master rules file and each facility's details at the time the workflow ran.</span>`;
show('overview');
</script></body></html>
